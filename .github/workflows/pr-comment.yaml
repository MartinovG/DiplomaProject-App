name: PR Message

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  welcome-msg:
    runs-on: ubuntu-latest
    steps:
      - name: Post or Update Preview Info
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://pr-${prNumber}.elsys.itgix.eu`;
            const namespace = `pr-${prNumber}`;
            const shortSha = context.payload.pull_request.head.sha.slice(0, 8);
            const backendTag = `backend-pr-${prNumber}-${shortSha}`;
            const frontendTag = `frontend-pr-${prNumber}-${shortSha}`;

            const body = `
            ### Preview Environment

            - **URL:** ${previewUrl}
            - **Namespace:** \`${namespace}\`
            - **Images:** \`${backendTag}\` / \`${frontendTag}\` (re-tagged on every push)
            `;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes('### Preview Environment')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
            }
